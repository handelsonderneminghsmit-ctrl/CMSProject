<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projecten – HS Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #e8191b; --red-dark: #b51214;
      --black: #0a0a0a; --dark: #111; --dark2: #1a1a1a; --dark3: #222;
      --border: #2a2a2a; --text: #e8e8e8; --muted: #888; --white: #fff;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Barlow', sans-serif; background: transparent; color: var(--text); overflow-x: hidden; }

    /* ── VIEWS ── */
    #view-grid   { display: block; }
    #view-detail { display: none; }

    .container { max-width: 1300px; margin: 0 auto; padding: 24px 16px 48px; }

    /* ── LOADING / EMPTY ── */
    .loading { text-align: center; padding: 60px 20px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--muted); font-size: 13px; }
    .empty-state { text-align: center; padding: 60px 20px; display: none; }
    .empty-state.visible { display: block; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }
    .empty-state h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--muted); }

    /* ── GRID ── */
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: stretch; }

    /* ── CARD ── */
    .project-card {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-bottom: 3px solid #1a1a1a;
      overflow: hidden;
      animation: cardIn .4s ease both;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      transition: transform .25s, border-color .25s, box-shadow .25s;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .card-header {
      background: linear-gradient(135deg, #1c1c1c 0%, #141414 100%);
      border-top: 3px solid var(--red);
      border-bottom: 1px solid #252525;
      padding: 18px 22px 16px;
    }
    .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2.5px; color: #fff; line-height: 1.1; }

    .card-photo-wrap { overflow: hidden; position: relative; flex-shrink: 0; }
    .card-photo { width: 100%; display: block; background: #0a0a0a; object-fit: contain; max-height: 280px; }
    .card-no-photo { width: 100%; aspect-ratio: 16/9; background: #0d0d0d; display: flex; align-items: center; justify-content: center; }
    .card-no-photo svg { opacity: .1; }

    .card-body { padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

    /* diensten op kaart */
    .diensten-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #555; display: flex; align-items: center; gap: 8px; }
    .diensten-label::after { content: ''; flex: 1; height: 1px; background: #222; }
    .diensten-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .dienst-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: #ccc; background: #161616; border: 1px solid #2a2a2a; border-left: 3px solid var(--red); padding: 3px 8px; }

    /* vermogen op kaart */
    .power-block { background: #0d0d0d; border: 1px solid #2a2a2a; border-top: 2px solid #222; overflow: hidden; margin-top: auto; }
    .power-block-title { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #444; padding: 6px 12px; border-bottom: 1px solid #1e1e1e; background: #0a0a0a; display: flex; align-items: center; gap: 8px; }
    .power-block-title::before { content: ''; width: 8px; height: 2px; background: var(--red); flex-shrink: 0; }
    .power-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px; gap: 6px; }
    .power-col { display: flex; flex-direction: column; gap: 2px; }
    .power-col.right { align-items: flex-end; }
    .power-col-label { font-family: 'Barlow Condensed', sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #444; }
    .power-col.right .power-col-label { color: rgba(232,25,27,.6); }
    .power-main { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; line-height: 1; color: #bbb; }
    .power-col.right .power-main { color: var(--red); }
    .power-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; color: #444; }
    .power-col.right .power-sub { color: rgba(232,25,27,.5); }
    .power-arrow { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .power-arrow-line { width: 30px; height: 2px; background: linear-gradient(90deg, #333, var(--red)); position: relative; }
    .power-arrow-line::after { content: ''; position: absolute; right: -1px; top: -4px; border-left: 7px solid var(--red); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    .power-gain { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 1px; color: var(--red); background: rgba(232,25,27,.1); border: 1px solid rgba(232,25,27,.2); padding: 1px 5px; white-space: nowrap; }

    .card-desc { font-size: 12px; line-height: 1.6; color: #555; border-top: 1px solid #1e1e1e; padding-top: 10px; }

    /* ── DETAIL VIEW ── */
    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      background: #161616;
      border: 1px solid #2a2a2a;
      padding: 10px 16px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: color .2s, border-color .2s;
    }
    .detail-back:hover { color: var(--white); border-color: var(--red); }
    .detail-back::before { content: '←'; font-size: 16px; }

    .detail-card {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      animation: cardIn .3s ease;
    }

    .detail-header {
      background: linear-gradient(135deg, #1c1c1c 0%, #141414 100%);
      border-top: 3px solid var(--red);
      border-bottom: 1px solid #252525;
      padding: 24px 28px 20px;
    }
    .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 3px; color: #fff; line-height: 1.1; }

    .detail-photo { width: 100%; display: block; max-height: 480px; object-fit: contain; background: #080808; border-bottom: 1px solid #1a1a1a; }

    .detail-content { display: flex; flex-direction: column; }
    .detail-section { padding: 22px 28px; border-bottom: 1px solid #1a1a1a; }
    .detail-section:last-child { border-bottom: none; }
    .detail-section-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .detail-section-label::after { content: ''; flex: 1; height: 1px; background: #1e1e1e; }

    /* detail diensten */
    .detail-diensten { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-dienst { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #ddd; background: #161616; border: 1px solid #2a2a2a; border-left: 3px solid var(--red); padding: 8px 14px; }

    /* detail vermogen */
    .detail-power-wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
    .detail-power-col { display: flex; flex-direction: column; gap: 6px; }
    .detail-power-col.right { align-items: flex-end; }
    .detail-power-label { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #444; }
    .detail-power-col.right .detail-power-label { color: rgba(232,25,27,.6); }
    .detail-pk { font-family: 'Bebas Neue', sans-serif; font-size: 56px; letter-spacing: 2px; line-height: 1; color: #bbb; }
    .detail-power-col.right .detail-pk { color: var(--red); }
    .detail-nm { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600; color: #444; }
    .detail-power-col.right .detail-nm { color: rgba(232,25,27,.5); }
    .detail-arrow-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .detail-arrow-line { width: 48px; height: 2px; background: linear-gradient(90deg, #333, var(--red)); position: relative; }
    .detail-arrow-line::after { content: ''; position: absolute; right: -1px; top: -5px; border-left: 10px solid var(--red); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .detail-gain { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; color: var(--red); background: rgba(232,25,27,.1); border: 1px solid rgba(232,25,27,.25); padding: 3px 10px; white-space: nowrap; text-align: center; }

    .detail-desc { font-size: 14px; line-height: 1.8; color: #777; }

    /* ── MOBIEL ── */
    @media (max-width: 600px) {
      .container { padding: 12px 10px 32px; }
      .projects-grid { grid-template-columns: 1fr; gap: 12px; }
      .card-title { font-size: 20px; }
      .card-title { font-size: 20px; }
      .card-header { padding: 12px 14px 10px; }
      .card-body { padding: 10px 14px 14px; }
      .card-photo { max-height: 180px; }
      .power-main { font-size: 20px; }
      .power-arrow-line { width: 20px; }

      .detail-header { padding: 16px 16px 14px; }
      .detail-title { font-size: 26px; letter-spacing: 2px; }
      .detail-photo { max-height: 260px; }
      .detail-section { padding: 16px; }
      .detail-pk { font-size: 38px; }
      .detail-pk span { font-size: 18px !important; }
      .detail-nm { font-size: 14px; }
      .detail-arrow-line { width: 28px; }
      .detail-gain { font-size: 12px; }
      .detail-power-wrap { gap: 8px; }
      .detail-dienst { font-size: 11px; padding: 6px 10px; }
      .detail-desc { font-size: 13px; }
      .detail-back { font-size: 11px; padding: 9px 14px; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--red); }
  </style>
</head>
<body>

<div id="top"></div>

<!-- GRID VIEW -->
<div id="view-grid">
  <div class="container">
    <div class="loading" id="loading"><div class="spinner"></div><p>Projecten laden...</p></div>
    <div class="empty-state" id="emptyState">
      <div class="icon">🚗</div>
      <h3>Nog geen projecten</h3>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </div>
</div>

<!-- DETAIL VIEW (niet meer gebruikt - navigeert naar detail.html) -->
<div id="view-detail" style="display:none">
  <div class="container">
    <button class="detail-back" id="detailBack">Terug naar overzicht</button>
    <div class="detail-card" id="detailCard"></div>
  </div>
</div>

<script type="module">
  import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyAWKsTh5rZWMk_8LWIYDBMlTavNa02m7yQ",
  authDomain: "hspcms-ffcd0.firebaseapp.com",
  databaseURL: "https://hspcms-ffcd0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hspcms-ffcd0",
  storageBucket: "hspcms-ffcd0.firebasestorage.app",
  messagingSenderId: "1073058165129",
  appId: "1:1073058165129:web:35bd6a5e7fdef49ef4f158"
};

  function calcGain(a, b) {
    const d = parseInt(b) - parseInt(a);
    return (!a || !b || isNaN(d) || d <= 0) ? null : '+' + d;
  }

  function makePowerCard(p) {
    if (!p.stage1 || (!p.stdPk && !p.hspPk)) return '';
    const pkGain = calcGain(p.stdPk, p.hspPk);
    const nmGain = calcGain(p.stdNm, p.hspNm);
    return `<div class="power-block">
      <div class="power-block-title">Vermogen & Koppel</div>
      <div class="power-row">
        <div class="power-col">
          <div class="power-col-label">Standaard</div>
          <div class="power-main">${p.stdPk||'–'} <span style="font-size:13px;opacity:.5">PK</span></div>
          ${p.stdNm ? `<div class="power-sub">${p.stdNm} NM</div>` : ''}
        </div>
        <div class="power-arrow">
          <div class="power-arrow-line"></div>
          ${pkGain ? `<div class="power-gain">${pkGain} PK</div>` : ''}
          ${nmGain ? `<div class="power-gain">${nmGain} NM</div>` : ''}
        </div>
        <div class="power-col right">
          <div class="power-col-label">HS Performance</div>
          <div class="power-main">${p.hspPk||'–'} <span style="font-size:13px;opacity:.6">PK</span></div>
          ${p.hspNm ? `<div class="power-sub">${p.hspNm} NM</div>` : ''}
        </div>
      </div>
    </div>`;
  }

  function makeDienstenCard(p) {
    if (!p.diensten?.length) return '';
    return `<div>
      <div class="diensten-label">Uitgevoerde werkzaamheden</div>
      <div class="diensten-list">${p.diensten.map(d=>`<span class="dienst-tag">${d}</span>`).join('')}</div>
    </div>`;
  }

  function makePowerDetail(p) {
    if (!p.stage1 || (!p.stdPk && !p.hspPk)) return '';
    const pkGain = calcGain(p.stdPk, p.hspPk);
    const nmGain = calcGain(p.stdNm, p.hspNm);
    return `<div class="detail-section">
      <div class="detail-section-label">Vermogen & Koppel</div>
      <div class="detail-power-wrap">
        <div class="detail-power-col">
          <div class="detail-power-label">Standaard</div>
          <div class="detail-pk">${p.stdPk||'–'} <span style="font-size:26px;opacity:.4">PK</span></div>
          ${p.stdNm ? `<div class="detail-nm">${p.stdNm} NM</div>` : ''}
        </div>
        <div class="detail-arrow-wrap">
          <div class="detail-arrow-line"></div>
          ${pkGain ? `<div class="detail-gain">${pkGain} PK</div>` : ''}
          ${nmGain ? `<div class="detail-gain">${nmGain} NM</div>` : ''}
        </div>
        <div class="detail-power-col right">
          <div class="detail-power-label">HS Performance</div>
          <div class="detail-pk">${p.hspPk||'–'} <span style="font-size:26px;opacity:.5">PK</span></div>
          ${p.hspNm ? `<div class="detail-nm">${p.hspNm} NM</div>` : ''}
        </div>
      </div>
    </div>`;
  }

  // Vertel de iframe-ouder hoe hoog de pagina is zodat er geen scrollbalk in het iframe komt
  function notifyHeight() {
    const h = document.body.scrollHeight;
    window.parent.postMessage({ type: 'hsp-resize', height: h }, '*');
  }



  try {
    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    onValue(ref(db, 'projects'), snap => {
      const raw = snap.val() || {};
      const projects = Object.values(raw).sort((a,b) => (b.ts||0)-(a.ts||0));
      render(projects);
    });
  } catch {
    document.getElementById('loading').innerHTML = '<p style="color:#666;font-size:13px">Kon geen verbinding maken.</p>';
  }

  function render(projects) {
    const grid  = document.getElementById('projectsGrid');
    const empty = document.getElementById('emptyState');
    document.getElementById('loading').style.display = 'none';
    grid.innerHTML = '';

    if (!projects.length) { empty.classList.add('visible'); notifyHeight(); return; }
    empty.classList.remove('visible');

    projects.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.style.animationDelay = `${i * 0.05}s`;

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">${p.titel || 'Project'}</div>
        </div>
        <div class="card-photo-wrap">
          ${p.photo
            ? `<img class="card-photo" src="${p.photo}" alt="${p.titel||''}" loading="lazy" onerror="this.style.background='#0a0a0a';this.src=''" />`
            : `<div class="card-no-photo"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`
          }
        </div>
        <div class="card-body">
          ${makeDienstenCard(p)}
          ${makePowerCard(p)}
          ${p.omschrijving ? `<div class="card-desc">${p.omschrijving}</div>` : ''}
        </div>`;

      grid.appendChild(card);
    });

    setTimeout(notifyHeight, 200);
  }

  // Luister naar resize events om ouder bij te houden
  new ResizeObserver(notifyHeight).observe(document.body);
</script>
</body>
</html>
