<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project – HS Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #e8191b; --red-dark: #b51214;
      --black: #0a0a0a; --dark: #111; --dark2: #1a1a1a; --dark3: #222;
      --border: #2a2a2a; --text: #e8e8e8; --muted: #888; --white: #fff;
    }
    body { font-family: 'Barlow', sans-serif; background: transparent; color: var(--text); overflow-x: hidden; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

    /* Terugknop */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      background: #161616;
      border: 1px solid #2a2a2a;
      padding: 11px 18px;
      cursor: pointer;
      margin-bottom: 24px;
      transition: color .2s, border-color .2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--white); border-color: var(--red); }
    .back-btn::before { content: '←'; font-size: 16px; }

    /* Detail kaart */
    .detail-card {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      overflow: hidden;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .detail-header {
      background: linear-gradient(135deg, #1c1c1c 0%, #141414 100%);
      border-top: 3px solid var(--red);
      border-bottom: 1px solid #252525;
      padding: 26px 32px 22px;
    }
    .detail-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px;
      letter-spacing: 3px;
      color: #fff;
      line-height: 1.1;
    }

    .detail-photo {
      width: 100%;
      display: block;
      max-height: 500px;
      object-fit: contain;
      background: #080808;
      border-bottom: 1px solid #1a1a1a;
    }

    .detail-content { display: flex; flex-direction: column; }
    .detail-section { padding: 24px 32px; border-bottom: 1px solid #1a1a1a; }
    .detail-section:last-child { border-bottom: none; }

    .detail-section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--red);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .detail-section-label::after { content: ''; flex: 1; height: 1px; background: #1e1e1e; }

    /* Diensten */
    .detail-diensten { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-dienst {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: #ddd;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-left: 3px solid var(--red);
      padding: 9px 16px;
    }

    /* Vermogen */
    .detail-power-wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; }
    .detail-power-col { display: flex; flex-direction: column; gap: 6px; }
    .detail-power-col.right { align-items: flex-end; }
    .detail-power-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: #444;
    }
    .detail-power-col.right .detail-power-label { color: rgba(232,25,27,.6); }
    .detail-pk {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px; letter-spacing: 2px; line-height: 1;
      color: #bbb;
    }
    .detail-power-col.right .detail-pk { color: var(--red); }
    .detail-nm {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 600; color: #444;
    }
    .detail-power-col.right .detail-nm { color: rgba(232,25,27,.5); }
    .detail-arrow-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .detail-arrow-line { width: 52px; height: 2px; background: linear-gradient(90deg, #333, var(--red)); position: relative; }
    .detail-arrow-line::after { content: ''; position: absolute; right: -1px; top: -5px; border-left: 10px solid var(--red); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .detail-gain {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; letter-spacing: 1px;
      color: var(--red);
      background: rgba(232,25,27,.1);
      border: 1px solid rgba(232,25,27,.25);
      padding: 4px 12px;
      white-space: nowrap;
      text-align: center;
    }

    /* Omschrijving */
    .detail-desc { font-size: 15px; line-height: 1.8; color: #777; }

    /* Niet gevonden */
    .not-found { text-align: center; padding: 60px 20px; color: var(--muted); }
    .not-found h3 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; margin-bottom: 8px; }

    /* Mobiel */
    @media (max-width: 600px) {
      .container { padding: 12px 10px 40px; }
      .detail-header { padding: 16px 16px 14px; }
      .detail-title { font-size: 28px; }
      .detail-section { padding: 16px; }
      .detail-pk { font-size: 42px; }
      .detail-pk span { font-size: 20px !important; }
      .detail-nm { font-size: 15px; }
      .detail-arrow-line { width: 28px; }
      .detail-gain { font-size: 13px; }
      .detail-power-wrap { gap: 10px; }
      .detail-dienst { font-size: 11px; padding: 7px 10px; }
      .detail-desc { font-size: 13px; }
      .back-btn { font-size: 11px; padding: 9px 14px; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--red); }
  </style>
</head>
<body>
<div class="container">
  <a class="back-btn" href="projecten.html">Terug naar overzicht</a>
  <div id="content"></div>
</div>

<script>
  function calcGain(a, b) {
    const d = parseInt(b) - parseInt(a);
    return (!a || !b || isNaN(d) || d <= 0) ? null : '+' + d;
  }

  const el = document.getElementById('content');

  let p = null;
  try { p = JSON.parse(sessionStorage.getItem('hsp_detail') || 'null'); } catch(e) {}

  if (!p) {
    el.innerHTML = `<div class="not-found"><h3>Project niet gevonden</h3><p>Ga terug naar het overzicht.</p></div>`;
  } else {
    // Diensten
    const dienstenHtml = p.diensten?.length ? `
      <div class="detail-section">
        <div class="detail-section-label">Uitgevoerde werkzaamheden</div>
        <div class="detail-diensten">${p.diensten.map(d=>`<div class="detail-dienst">${d}</div>`).join('')}</div>
      </div>` : '';

    // Vermogen
    let vermogenHtml = '';
    if (p.stage1 && (p.stdPk || p.hspPk)) {
      const pkGain = calcGain(p.stdPk, p.hspPk);
      const nmGain = calcGain(p.stdNm, p.hspNm);
      vermogenHtml = `
        <div class="detail-section">
          <div class="detail-section-label">Vermogen & Koppel</div>
          <div class="detail-power-wrap">
            <div class="detail-power-col">
              <div class="detail-power-label">Standaard</div>
              <div class="detail-pk">${p.stdPk||'–'} <span style="font-size:28px;opacity:.4">PK</span></div>
              ${p.stdNm ? `<div class="detail-nm">${p.stdNm} NM</div>` : ''}
            </div>
            <div class="detail-arrow-wrap">
              <div class="detail-arrow-line"></div>
              ${pkGain ? `<div class="detail-gain">${pkGain} PK</div>` : ''}
              ${nmGain ? `<div class="detail-gain">${nmGain} NM</div>` : ''}
            </div>
            <div class="detail-power-col right">
              <div class="detail-power-label">HS Performance</div>
              <div class="detail-pk">${p.hspPk||'–'} <span style="font-size:28px;opacity:.5">PK</span></div>
              ${p.hspNm ? `<div class="detail-nm">${p.hspNm} NM</div>` : ''}
            </div>
          </div>
        </div>`;
    }

    // Omschrijving
    const descHtml = p.omschrijving ? `
      <div class="detail-section">
        <div class="detail-section-label">Toelichting</div>
        <div class="detail-desc">${p.omschrijving}</div>
      </div>` : '';

    el.innerHTML = `
      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-title">${p.titel || 'Project'}</div>
        </div>
        ${p.photo ? `<img class="detail-photo" src="${p.photo}" alt="${p.titel||''}" onerror="this.style.display='none'" />` : ''}
        <div class="detail-content">
          ${dienstenHtml}
          ${vermogenHtml}
          ${descHtml}
        </div>
      </div>`;
  }
</script>
</body>
</html>
