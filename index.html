<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS – HS Performance Projecten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e8191b;
      --red-dark: #b51214;
      --green: #1db954;
      --black: #0a0a0a;
      --dark: #111111;
      --dark2: #1a1a1a;
      --dark3: #222222;
      --border: #2a2a2a;
      --border2: #333;
      --text: #e8e8e8;
      --muted: #888;
      --white: #ffffff;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at center, #1a0000 0%, var(--black) 70%);
    }
    .login-box {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: var(--white);
      margin-bottom: 4px;
    }
    .login-logo span { color: var(--red); }
    .login-sub {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 36px;
    }
    .login-box input {
      width: 100%;
      background: var(--dark3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 12px 16px;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .login-box input:focus { border-color: var(--red); }
    .login-btn {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      padding: 13px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .login-btn:hover { background: var(--red-dark); }
    .login-error {
      color: var(--red);
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    /* ── APP ── */
    .app { display: none; }
    .app.active { display: block; }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--dark2);
      border-bottom: 2px solid var(--red);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--white);
    }
    .topbar-logo span { color: var(--red); }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .topbar-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(232,25,27,0.15);
      color: var(--red);
      border: 1px solid rgba(232,25,27,0.3);
      padding: 4px 10px;
    }
    .btn-logout {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover { color: var(--white); border-color: var(--text); }

    /* ── LAYOUT ── */
    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      min-height: calc(100vh - 57px);
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── FORM PANEL ── */
    .form-panel {
      background: var(--dark);
      border-right: 1px solid var(--border);
      padding: 28px 28px 60px;
      overflow-y: auto;
    }
    .panel-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-title .dot {
      width: 8px; height: 8px;
      background: var(--red);
      flex-shrink: 0;
    }

    /* form fields */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .field label .req { color: var(--red); margin-left: 2px; }
    .field input[type="text"],
    .field input[type="date"],
    .field textarea,
    .field select {
      width: 100%;
      background: var(--dark3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 10px 14px;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--red);
    }
    textarea { min-height: 80px; }

    /* photo upload */
    .photo-upload {
      border: 2px dashed var(--border2);
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .photo-upload:hover, .photo-upload.drag {
      border-color: var(--red);
      background: rgba(232,25,27,0.04);
    }
    .photo-upload input { display: none; }
    .photo-upload-icon { font-size: 36px; margin-bottom: 8px; }
    .photo-upload p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .photo-upload span {
      font-size: 11px;
      color: var(--border2);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 1px;
    }
    .photo-preview {
      margin-top: 12px;
      position: relative;
      display: none;
    }
    .photo-preview.visible { display: block; }
    .photo-preview img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
    }
    .photo-remove {
      position: absolute;
      top: 8px; right: 8px;
      background: var(--red);
      color: #fff;
      border: none;
      width: 26px; height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .photo-remove:hover { background: var(--red-dark); }

    /* diensten checkboxes */
    .diensten-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .dienst-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--dark3);
      border: 1px solid var(--border);
      padding: 8px 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .dienst-item:hover { border-color: var(--border2); }
    .dienst-item.checked {
      border-color: var(--red);
      background: rgba(232,25,27,0.08);
    }
    .dienst-item input[type="checkbox"] { display: none; }
    .dienst-check {
      width: 16px; height: 16px;
      border: 1.5px solid var(--border2);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .dienst-item.checked .dienst-check {
      background: var(--red);
      border-color: var(--red);
    }
    .dienst-check-icon {
      color: #fff;
      font-size: 10px;
      display: none;
    }
    .dienst-item.checked .dienst-check-icon { display: block; }
    .dienst-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
    }
    .dienst-item.checked .dienst-name { color: var(--text); }

    /* stage1 panel */
    .stage1-panel {
      display: none;
      background: rgba(232,25,27,0.05);
      border: 1px solid rgba(232,25,27,0.2);
      padding: 16px;
      margin-top: 12px;
    }
    .stage1-panel.visible { display: block; }
    .stage1-panel .stage1-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 12px;
    }
    .power-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .power-col-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .power-col-label.hs { color: var(--red); }
    .power-input-group { display: flex; flex-direction: column; gap: 8px; }
    .power-input-row { display: flex; align-items: center; gap: 6px; }
    .power-input-row input {
      flex: 1;
      background: var(--dark3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 8px 10px;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .power-input-row input:focus { border-color: var(--red); }
    .power-unit {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      white-space: nowrap;
      min-width: 24px;
    }

    /* submit */
    .btn-submit {
      width: 100%;
      background: var(--red);
      color: #fff;
      border: none;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--red-dark); }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit.loading { opacity: 0.6; pointer-events: none; }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--green);
      color: #fff;
      padding: 12px 20px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 0;
      transform: translateY(80px);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 9999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: var(--red); }

    /* ── PROJECTS LIST PANEL ── */
    .list-panel {
      background: var(--dark2);
      padding: 28px 28px 60px;
      overflow-y: auto;
    }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .list-count {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .list-count strong { color: var(--red); font-size: 16px; }

    .btn-view {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-view:hover { color: var(--white); border-color: var(--red); }

    /* project row */
    .project-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--dark3);
      border: 1px solid var(--border);
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
      animation: rowIn 0.3s ease both;
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .project-row:hover { border-color: var(--border2); }
    .row-thumb {
      width: 72px;
      height: 54px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }
    .row-info { flex: 1; min-width: 0; }
    .row-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--white);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-diensten {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .row-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(232,25,27,0.1);
      color: var(--red);
      border: 1px solid rgba(232,25,27,0.2);
      padding: 2px 6px;
    }
    .row-date {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      white-space: nowrap;
      margin-left: auto;
      flex-shrink: 0;
    }
    .btn-delete {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 30px; height: 30px;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-delete:hover { background: var(--red); border-color: var(--red); color: #fff; }

    .empty-list {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-list p { font-size: 13px; margin-top: 10px; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">HS <span>Performance</span></div>
    <div class="login-sub">CMS Beheer</div>
    <input type="password" id="pwInput" placeholder="Wachtwoord" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Inloggen</button>
    <div class="login-error" id="loginError">Onjuist wachtwoord</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appWrap">
  <div class="topbar">
    <div class="topbar-logo">HS <span>Performance</span></div>
    <div class="topbar-right">
      <span class="topbar-badge">CMS Beheer</span>
      <button class="btn-logout" onclick="doLogout()">Uitloggen</button>
    </div>
  </div>

  <div class="layout">
    <!-- FORM -->
    <div class="form-panel">
      <div class="panel-title"><div class="dot"></div> Project Toevoegen</div>

      <!-- Titel -->
      <div class="field">
        <label>Auto / Titel <span class="req">*</span></label>
        <input type="text" id="fTitel" placeholder="bijv. Volkswagen Golf 7 1.4 TSI" />
      </div>

      <!-- Foto -->
      <div class="field">
        <label>Foto</label>
        <div class="photo-upload" id="photoUploadZone" onclick="document.getElementById('fFoto').click()">
          <input type="file" id="fFoto" accept="image/*" onchange="handlePhoto(this)" />
          <div class="photo-upload-icon">📷</div>
          <p>Klik om een foto te uploaden</p>
          <span>JPG, PNG, WEBP – max 5MB</span>
        </div>
        <div class="photo-preview" id="photoPreview">
          <img id="photoPreviewImg" src="" alt="Preview" />
          <button class="photo-remove" onclick="removePhoto()">✕</button>
        </div>
      </div>

      <!-- Diensten -->
      <div class="field">
        <label>Uitgevoerde Diensten</label>
        <div class="diensten-grid" id="dienstenGrid"></div>
      </div>

      <!-- Stage 1 panel -->
      <div class="stage1-panel" id="stage1Panel">
        <div class="stage1-title">⚡ Vermogensgegevens Stage 1</div>
        <div class="power-grid">
          <div>
            <div class="power-col-label">Standaard</div>
            <div class="power-input-group">
              <div class="power-input-row">
                <input type="text" id="fStdPk" placeholder="bijv. 150" />
                <span class="power-unit">PK</span>
              </div>
              <div class="power-input-row">
                <input type="text" id="fStdNm" placeholder="bijv. 280" />
                <span class="power-unit">NM</span>
              </div>
            </div>
          </div>
          <div>
            <div class="power-col-label hs">HS Performance</div>
            <div class="power-input-group">
              <div class="power-input-row">
                <input type="text" id="fHspPk" placeholder="bijv. 200" />
                <span class="power-unit">PK</span>
              </div>
              <div class="power-input-row">
                <input type="text" id="fHspNm" placeholder="bijv. 350" />
                <span class="power-unit">NM</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Omschrijving -->
      <div class="field" style="margin-top:18px">
        <label>Omschrijving (optioneel)</label>
        <textarea id="fOmschrijving" placeholder="Extra toelichting bij dit project..."></textarea>
      </div>

      <!-- Datum -->
      <div class="field">
        <label>Datum</label>
        <input type="date" id="fDatum" />
      </div>

      <button class="btn-submit" id="submitBtn" onclick="submitProject()">Project Toevoegen</button>
    </div>

    <!-- LIST -->
    <div class="list-panel">
      <div class="list-header">
        <div class="panel-title" style="margin:0;padding:0;border:0">
          <div class="dot"></div> Projecten
          <span class="list-count" style="margin-left:8px"><strong id="countBadge">0</strong> items</span>
        </div>
        <a href="projecten.html" target="_blank" class="btn-view">Bekijk Pagina →</a>
      </div>
      <div id="projectsList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'hsp_projects_v1';
  const CMS_PW = 'hsperformance2025'; // ← pas dit wachtwoord aan

  // ── DIENSTEN LIJST ──
  const DIENSTEN = [
    { id: 'stage1',     label: 'Stage 1 Chiptuning', isStage1: true },
    { id: 'dsg',        label: 'DSG / Automaat Tuning' },
    { id: 'dpf',        label: 'DPF Verwijderen' },
    { id: 'adblue',     label: 'AdBlue Uitschakelen' },
    { id: 'egr',        label: 'EGR Uitschakelen' },
    { id: 'maf',        label: 'Luchtmassameter Wegschrijven' },
    { id: 'o2nox',      label: 'O2/NOx Sensor Wegschrijven' },
    { id: 'swirl',      label: 'Swirl Flaps Uitschakelen' },
    { id: 'startstop',  label: 'Start/Stop Uitschakelen' },
    { id: 'snelheid',   label: 'Snelheidsbegrenzer Verwijderen' },
    { id: 'foutcodes',  label: 'Foutcodes Uitschakelen' },
    { id: 'launch',     label: 'Launch Control' },
    { id: 'pops',       label: 'Pops & Bangs' },
    { id: 'hardcut',    label: 'Hardcut Limiter' },
    { id: 'antilag',    label: 'Antilag' },
  ];

  let photoData = null;
  let checkedDiensten = new Set();

  // ── LOGIN ──
  function doLogin() {
    const pw = document.getElementById('pwInput').value;
    if (pw === CMS_PW) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('appWrap').classList.add('active');
      initApp();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('pwInput').value = '';
    }
  }
  function doLogout() {
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('appWrap').classList.remove('active');
    document.getElementById('pwInput').value = '';
  }

  // ── INIT ──
  function initApp() {
    buildDiensten();
    setDefaultDate();
    renderList();
    setupDragDrop();
  }

  function setDefaultDate() {
    const d = new Date();
    document.getElementById('fDatum').value = d.toISOString().split('T')[0];
  }

  // ── DIENSTEN ──
  function buildDiensten() {
    const grid = document.getElementById('dienstenGrid');
    grid.innerHTML = '';
    DIENSTEN.forEach(d => {
      const item = document.createElement('label');
      item.className = 'dienst-item';
      item.innerHTML = `
        <input type="checkbox" value="${d.id}" onchange="toggleDienst('${d.id}', this.checked, ${!!d.isStage1})" />
        <div class="dienst-check"><span class="dienst-check-icon">✓</span></div>
        <span class="dienst-name">${d.label}</span>`;
      grid.appendChild(item);
    });
  }

  function toggleDienst(id, checked, isStage1) {
    const item = event.currentTarget;
    item.classList.toggle('checked', checked);
    if (checked) checkedDiensten.add(id);
    else checkedDiensten.delete(id);
    if (isStage1) {
      document.getElementById('stage1Panel').classList.toggle('visible', checked);
    }
  }

  // ── PHOTO ──
  function handlePhoto(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('Foto te groot (max 5MB)', true); return; }
    const reader = new FileReader();
    reader.onload = e => {
      photoData = e.target.result;
      document.getElementById('photoPreviewImg').src = photoData;
      document.getElementById('photoPreview').classList.add('visible');
    };
    reader.readAsDataURL(file);
  }
  function removePhoto() {
    photoData = null;
    document.getElementById('fFoto').value = '';
    document.getElementById('photoPreview').classList.remove('visible');
    document.getElementById('photoPreviewImg').src = '';
  }

  // drag & drop
  function setupDragDrop() {
    const zone = document.getElementById('photoUploadZone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const dt = new DataTransfer();
        dt.items.add(file);
        const input = document.getElementById('fFoto');
        input.files = dt.files;
        handlePhoto(input);
      }
    });
  }

  // ── SUBMIT ──
  function submitProject() {
    const titel = document.getElementById('fTitel').value.trim();
    if (!titel) { showToast('Vul een auto / titel in', true); return; }

    const stage1 = checkedDiensten.has('stage1');
    const project = {
      id: Date.now().toString(),
      titel,
      photo: photoData || '',
      diensten: DIENSTEN.filter(d => checkedDiensten.has(d.id)).map(d => d.label),
      stage1,
      stdPk: stage1 ? document.getElementById('fStdPk').value.trim() : '',
      stdNm: stage1 ? document.getElementById('fStdNm').value.trim() : '',
      hspPk: stage1 ? document.getElementById('fHspPk').value.trim() : '',
      hspNm: stage1 ? document.getElementById('fHspNm').value.trim() : '',
      omschrijving: document.getElementById('fOmschrijving').value.trim(),
      datum: document.getElementById('fDatum').value,
    };

    const projects = getProjects();
    projects.push(project);
    saveProjects(projects);

    resetForm();
    renderList();
    showToast('✓ Project toegevoegd!');
  }

  function resetForm() {
    document.getElementById('fTitel').value = '';
    document.getElementById('fOmschrijving').value = '';
    document.getElementById('fStdPk').value = '';
    document.getElementById('fStdNm').value = '';
    document.getElementById('fHspPk').value = '';
    document.getElementById('fHspNm').value = '';
    removePhoto();
    checkedDiensten.clear();
    document.querySelectorAll('.dienst-item').forEach(i => i.classList.remove('checked'));
    document.querySelectorAll('.dienst-item input').forEach(i => i.checked = false);
    document.getElementById('stage1Panel').classList.remove('visible');
    setDefaultDate();
  }

  // ── STORAGE ──
  function getProjects() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  }
  function saveProjects(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  // ── LIST ──
  function renderList() {
    const projects = getProjects();
    const list = document.getElementById('projectsList');
    document.getElementById('countBadge').textContent = projects.length;
    list.innerHTML = '';

    if (!projects.length) {
      list.innerHTML = '<div class="empty-list"><div style="font-size:40px;opacity:.3">🚗</div><p>Nog geen projecten toegevoegd.</p></div>';
      return;
    }

    projects.slice().reverse().forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'project-row';
      row.style.animationDelay = `${i * 0.04}s`;

      const pills = (p.diensten || []).slice(0, 3).map(d =>
        `<span class="row-pill">${d}</span>`
      ).join('') + (p.diensten?.length > 3 ? `<span class="row-pill">+${p.diensten.length - 3}</span>` : '');

      row.innerHTML = `
        <img class="row-thumb" src="${p.photo || ''}" alt="" onerror="this.style.background='#333';this.src=''" />
        <div class="row-info">
          <div class="row-title">${p.titel}</div>
          <div class="row-diensten">${pills}</div>
        </div>
        ${p.datum ? `<div class="row-date">${new Date(p.datum).toLocaleDateString('nl-NL', {day:'2-digit',month:'short',year:'numeric'})}</div>` : ''}
        <button class="btn-delete" onclick="deleteProject('${p.id}')" title="Verwijderen">✕</button>`;

      list.appendChild(row);
    });
  }

  function deleteProject(id) {
    if (!confirm('Project verwijderen?')) return;
    const projects = getProjects().filter(p => p.id !== id);
    saveProjects(projects);
    renderList();
    showToast('Project verwijderd');
  }

  // ── TOAST ──
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    void t.offsetWidth;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }
</script>
</body>
</html>
